# Builds an Astro site and deploys it to GitHub Pages
name: Build and Deploy (Astro → GitHub Pages)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate build info
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_TIME=$(date -u +'%H:%M:%S')
          TIMESTAMP=$(date -u +%s)

          cat <<EOF > build-info.json
          {
            "buildDate": "$BUILD_DATE",
            "buildTime": "$BUILD_TIME",
            "timestamp": $TIMESTAMP
          }
          EOF

      - name: Build site
        run: npm run build

      - name: Copy build info into dist
        run: |
          cp build-info.json dist/build-info.json
          cp version.json dist/version.json

      # Use the updated upload-pages-artifact action (v3) which uses supported upload-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
