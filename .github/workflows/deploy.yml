name: Deploy to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches: [ main ]
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate build info
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_TIME=$(date -u +'%H:%M:%S')
          BUILD_TIMESTAMP=$(date -u +%s)
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          NODE_VERSION=$(node --version)
          ASTRO_VERSION=$(node -p "require('./package.json').dependencies.astro.replace('^', '')")
          THREE_VERSION=$(node -p "require('./package.json').dependencies.three.replace('^', '')")
          MERMAID_VERSION=$(node -p "require('./package.json').dependencies.mermaid.replace('^', '')")
          PDFJS_VERSION=$(node -p "require('./package.json').dependencies['pdfjs-dist'].replace('^', '')")
          MARKED_VERSION=$(node -p "require('./package.json').dependencies.marked.replace('^', '')")
          echo "Generating build-info.json with timestamp: $BUILD_DATE at $BUILD_TIME UTC (deployment $GITHUB_RUN_NUMBER)"
          cat <<EOF > build-info.json
          {
            "buildDate": "$BUILD_DATE",
            "buildTime": "$BUILD_TIME",
            "timestamp": $BUILD_TIMESTAMP,
            "deployment": $GITHUB_RUN_NUMBER,
            "gitSha": "$GIT_SHA",
            "gitBranch": "$GIT_BRANCH",
            "nodeVersion": "$NODE_VERSION",
            "astroVersion": "$ASTRO_VERSION",
            "threeVersion": "$THREE_VERSION",
            "mermaidVersion": "$MERMAID_VERSION",
            "pdfjsVersion": "$PDFJS_VERSION",
            "markedVersion": "$MARKED_VERSION",
            "workflowRun": "$GITHUB_RUN_ID"
          }
          EOF
          cat build-info.json
          ls -la build-info.json

      - name: Sync build/version json into public
        run: |
          cp build-info.json public/build-info.json
          cp version.json public/version.json
        
      - name: Build with Astro
        env:
          PUBLIC_ANALYTICS_API: ${{ secrets.PUBLIC_ANALYTICS_API || 'https://analytics-api-one.vercel.app/api' }}
        run: npm run build
        
      - name: Verify build info in dist
        run: |
          if [ -f dist/_astro/build-info.*.json ] || grep -r "buildDate" dist/ 2>/dev/null; then
            echo "Build info found in dist"
          else
            echo "Warning: Build info may not be bundled correctly"
          fi
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

